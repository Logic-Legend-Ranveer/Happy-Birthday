<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="doc-title">Happy Birthday</title>
<meta id="doc-desc" name="description" content="A birthday page.">
<meta name="theme-color" content="#17121A">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,900;1,500;1,600&family=Manrope:wght@400;700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #17121A;
    --smoke: #241E29;
    --ember: #FF8A3D;
    --gold: #FFC857;
    --wax: #F4E9DD;
    --dusk: #5B4568;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--ink);
    color: var(--wax);
    font-family: 'Manrope', sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
  }

  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: var(--ink);
  }
  .bg-layer::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 90% 60% at 50% 100%, rgba(255,200,87,0.30), rgba(255,138,61,0.10) 45%, transparent 72%);
    opacity: 0;
    transition: opacity 1.8s ease;
  }
  body.wish-made .bg-layer::after { opacity: 1; }

  main, section { position: relative; z-index: 1; }

  section {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 5rem 1.5rem;
  }

  .wrap { max-width: 620px; margin: 0 auto; width: 100%; }

  .eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.85;
    margin-bottom: 2rem;
    display: inline-block;
  }

  /* candle row */
  .candle-row {
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 7px;
    flex-wrap: wrap;
    row-gap: 15px;
    margin: 0 auto 2rem;
    padding-top: 20px;
    max-width: 500px;
  }
  .candle {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    transform: rotate(var(--r));
  }
  .wick {
    width: 3px;
    height: var(--h);
    background: linear-gradient(var(--dusk), var(--smoke));
    border-radius: 2px;
  }
  .flame-wrap {
    display: block;
    opacity: 0;
    transform: scale(0);
    animation: ignite 0.5s cubic-bezier(.34,1.56,.64,1) forwards;
    animation-delay: calc(var(--i) * 0.13s + 0.4s);
    margin-bottom: -2px;
  }
  .flame {
    display: block;
    width: 9px;
    height: 13px;
    border-radius: 0 50% 50% 50%;
    transform: rotate(45deg);
    background: linear-gradient(160deg, var(--gold) 0%, var(--ember) 100%);
    box-shadow: 0 0 7px 1px rgba(255,138,61,0.5);
    animation: flicker 2.4s ease-in-out infinite;
    animation-delay: calc(var(--i) * 0.09s);
  }
  body.wish-made .flame-wrap {
    animation: none;
    opacity: 0;
    transform: scale(0);
    transition: opacity 0.35s ease, transform 0.35s ease;
    transition-delay: calc(var(--i) * 0.025s);
  }
  .puff {
    position: absolute;
    left: 50%;
    top: 60%;
    width: 20px;
    height: 20px;
    margin: -10px 0 0 -10px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(244,233,221,0.75), transparent 70%);
    opacity: 0;
    transform: scale(0.3);
    pointer-events: none;
    z-index: 2;
  }
  body.wish-made .puff { animation: puffOut 0.7s ease-out forwards; }

  @keyframes ignite {
    0% { opacity: 0; transform: scale(0); }
    70% { opacity: 1; transform: scale(1.2); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes flicker {
    0%, 100% { transform: rotate(45deg) scale(1); filter: brightness(1); }
    25% { transform: rotate(41deg) scale(0.94); filter: brightness(1.1); }
    50% { transform: rotate(48deg) scale(1.05); filter: brightness(0.94); }
    75% { transform: rotate(43deg) scale(0.97); filter: brightness(1.06); }
  }
  @keyframes puffOut {
    0% { opacity: 0.7; transform: scale(0.3); }
    100% { opacity: 0; transform: scale(7); }
  }

  .hero-text {
    opacity: 0;
    transform: translateY(16px);
    animation: heroIn 0.9s ease forwards;
    animation-delay: 0.9s;
  }
  @keyframes heroIn {
    to { opacity: 1; transform: translateY(0); }
  }

  h1 {
    font-family: 'Fraunces', serif;
    line-height: 1;
    margin-bottom: 1.6rem;
  }
  h1 .line1 {
    display: block;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.6rem, 6vw, 2.4rem);
    color: var(--wax);
    opacity: 0.9;
    margin-bottom: 0.3rem;
  }
  h1 .line2 {
    display: block;
    font-style: normal;
    font-weight: 900;
    font-size: clamp(3.4rem, 17vw, 7rem);
    letter-spacing: -0.02em;
    color: var(--gold);
  }
  @supports ((background-clip: text) or (-webkit-background-clip: text)) {
    h1 .line2 {
      background: linear-gradient(120deg, var(--gold), var(--ember));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
  }

  .subhead {
    font-size: clamp(1rem, 3.6vw, 1.15rem);
    line-height: 1.55;
    max-width: 30rem;
    margin: 0 auto 2.4rem;
    color: var(--wax);
    opacity: 0.78;
  }

  .wish-btn {
    -webkit-appearance: none;
    appearance: none;
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    color: var(--ink);
    background: linear-gradient(120deg, var(--gold), var(--ember));
    border: none;
    padding: 0.95rem 2.2rem;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(255,138,61,0.35);
    transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.25s ease;
  }
  .wish-btn:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 10px 30px rgba(255,138,61,0.5); }
  .wish-btn:active { transform: translateY(0) scale(0.98); }
  .wish-btn:disabled { opacity: 0.6; cursor: default; transform: none; }
  .wish-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }

  .wish-note {
    margin-top: 1.1rem;
    font-size: 0.9rem;
    color: var(--gold);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.6s ease, transform 0.6s ease;
    font-family: 'Space Mono', monospace;
  }
  .wish-note.show { opacity: 0.85; transform: translateY(0); }

  h2.eyebrow-title {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(1.3rem, 4vw, 1.7rem);
    margin-bottom: 1.6rem;
    color: var(--wax);
  }

  .card {
    background: rgba(244,233,221,0.05);
    border: 1px solid rgba(244,233,221,0.14);
    border-radius: 30px 10px 30px 10px;
    padding: 2.6rem 2.1rem;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .card p {
    font-size: clamp(1.05rem, 3.4vw, 1.25rem);
    line-height: 1.75;
    color: var(--wax);
    font-weight: 400;
  }
  .card p + p { margin-top: 1.2rem; }

  .reveal {
    opacity: 0;
    transform: translateY(26px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }
  .reveal.visible { opacity: 1; transform: translateY(0); }

  .closing h2 {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: clamp(2.2rem, 8vw, 3.6rem);
    color: var(--wax);
    margin-bottom: 0.8rem;
  }
  .closing p {
    font-size: clamp(1rem, 3.6vw, 1.15rem);
    color: var(--gold);
    font-style: italic;
    font-weight: 500;
    font-family: 'Fraunces', serif;
  }

  @media (max-width: 420px) {
    .candle-row { gap: 5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>

<div class="bg-layer"></div>

<main>
  <section class="hero">
    <div class="wrap">
      <!-- Injected via JS -->
      <span class="eyebrow" id="top-eyebrow"></span>

      <!-- Candles populated dynamically based on age -->
      <div class="candle-row" id="candle-row" aria-hidden="true">
        <span class="puff"></span>
      </div>

      <div class="hero-text">
        <h1>
          <span class="line1">Happy birthday</span>
          <span class="line2" id="hero-name"></span>
        </h1>
        <p class="subhead" id="hero-subhead"></p>
        <button type="button" class="wish-btn" id="wishBtn">Make the wish</button>
        <div class="wish-note" id="wishNote">It's already on its way.</div>
      </div>
    </div>
  </section>

  <section class="message">
    <div class="wrap reveal">
      <h2 class="eyebrow-title" id="msg-eyebrow"></h2>
      <div class="card" id="msg-card">
        <!-- Message populated dynamically -->
      </div>
    </div>
  </section>

  <section class="closing">
    <div class="wrap reveal">
      <h2 id="closing-title"></h2>
      <p>Go have the best one yet.</p>
    </div>
  </section>
</main>

<script>
(function () {
  // ==========================================
  // CONFIGURATION: Edit these details easily!
  // ==========================================
  const PERSON = {
    name: "'person name",
    age: 15,
    gender: "male", // Options: "male", "female", "other"
    
    // Write your message here. Each item in the array becomes a new paragraph <p>.
    // Available placeholders: {name}, {age}, {subject} (he/she/they), {object} (him/her/them), {possessive} (his/her/their)
    messageParagraphs: [
      "<Message> Example:",
      "Turning {age} is a strange kind of milestone &mdash; not one of the loud ones, but real all the same. The world is opening up for you, bringing more freedom, higher stakes, and better stories.",
      "Here's to a year filled with good friends, easy days, and a few risks worth taking as {subject} steps into {possessive} next chapter."
    ]
  };

  // 1. Get correct pronouns based on gender
  function getPronouns(gender) {
    const g = gender.toLowerCase();
    if (g === "male") return { subject: "he", object: "him", possessive: "his" };
    if (g === "female") return { subject: "she", object: "her", possessive: "her" };
    return { subject: "they", object: "them", possessive: "their" }; 
  }
  const pronouns = getPronouns(PERSON.gender);

  // 2. Helper to get "st", "nd", "rd", "th" for the age
  function getOrdinal(n) {
    const s = ["th", "st", "nd", "rd"];
    const v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }

  // 3. Populate HTML Elements dynamically
  document.getElementById('doc-title').innerText = `Happy Birthday ${PERSON.name}`;
  document.getElementById('doc-desc').content = `A birthday page for ${PERSON.name}, turning ${PERSON.age}.`;
  
  document.getElementById('top-eyebrow').innerHTML = `${PERSON.age} candles &middot; 1 wish`;
  document.getElementById('hero-name').innerText = PERSON.name;
  document.getElementById('hero-subhead').innerHTML = `Turning ${PERSON.age} skips the milestone hype &mdash; so here's a proper one anyway.`;
  
  document.getElementById('msg-eyebrow').innerText = `For ${PERSON.name}`;
  
  // Format and inject the custom message paragraphs
  const formattedMessage = PERSON.messageParagraphs.map(paragraph => {
    let text = paragraph
      .replace(/{name}/g, PERSON.name)
      .replace(/{age}/g, PERSON.age)
      .replace(/{subject}/g, pronouns.subject)
      .replace(/{object}/g, pronouns.object)
      .replace(/{possessive}/g, pronouns.possessive);
    return `<p>${text}</p>`;
  }).join("");
  
  document.getElementById('msg-card').innerHTML = formattedMessage;
  
  document.getElementById('closing-title').innerHTML = `Happy ${getOrdinal(PERSON.age)},<br>${PERSON.name}.`;

  // 4. Generate the exact number of candles dynamically
  const candleRow = document.getElementById('candle-row');
  let candlesHTML = '<span class="puff"></span>';
  for (let i = 0; i < PERSON.age; i++) {
    // Randomize flame timings, heights, and rotations slightly for a natural look
    const height = Math.floor(Math.random() * 15) + 32; // Random height 32-46
    const rotation = Math.floor(Math.random() * 9) - 4; // Random rotation -4 to 4
    candlesHTML += `<div class="candle" style="--i:${i}; --h:${height}px; --r:${rotation}deg;"><span class="flame-wrap"><span class="flame"></span></span><span class="wick"></span></div>`;
  }
  candleRow.innerHTML = candlesHTML;

  // ==========================================
  // Interactions & Animations (Existing Code)
  // ==========================================
  var wishBtn = document.getElementById('wishBtn');
  var wishNote = document.getElementById('wishNote');
  var wished = false;

  wishBtn.addEventListener('click', function () {
    if (wished) return;
    wished = true;
    document.body.classList.add('wish-made');
    wishBtn.textContent = 'Wish made';
    wishBtn.disabled = true;
    setTimeout(function () {
      wishNote.classList.add('show');
    }, 550);
  });

  var revealEls = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.2 });
    revealEls.forEach(function (el) { io.observe(el); });
  } else {
    revealEls.forEach(function (el) { el.classList.add('visible'); });
  }
})();
</script>
</body>
</html>
